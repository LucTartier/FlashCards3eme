<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlashCards pour Réviser</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --border: #d9dde3;
    --text: #1f2328;
    --muted: #5b6470;
    --accent: #1f6feb;
    --accent-text: #ffffff;
    --answer: #1a7f37;
    --error-bg: #ffebe9;
    --error-text: #a40e26;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c;
      --panel: #1c2128;
      --border: #3a424d;
      --text: #e6e9ee;
      --muted: #9aa4b1;
      --accent: #4c8dff;
      --accent-text: #0b1220;
      --answer: #56d364;
      --error-bg: #3a1a1f;
      --error-text: #ffa198;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .app { max-width: 640px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { display: flex; align-items: center; gap: 12px; font-size: 1.4rem; margin: 0 0 20px; }
  h1 svg { width: 36px; height: 36px; flex: none; }
  [hidden] { display: none !important; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
  }

  label.field { display: block; font-weight: 600; margin-bottom: 6px; }
  select {
    width: 100%;
    padding: 10px 12px;
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .check { display: flex; align-items: center; gap: 8px; margin: 14px 0 18px; }

  .btn {
    font: inherit;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.link { border: none; background: none; color: var(--accent); padding: 6px 0; font-weight: 500; }
  .btn.link:hover { text-decoration: underline; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  #status { margin: 16px 0 0; font-size: .9rem; color: var(--muted); }
  #status.error { background: var(--error-bg); color: var(--error-text); padding: 10px 12px; border-radius: 8px; }

  .local-info { margin-top: 16px; font-size: .9rem; color: var(--muted); }
  .local-info code {
    display: block;
    margin: 4px 0 6px;
    padding: 8px 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: .85rem;
    word-break: break-all;
    user-select: all;
  }

  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; color: var(--muted); font-size: .9rem; }
  .top .titre { font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .carte {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 200px;
    padding: 24px;
    font: inherit;
    font-size: 1.2rem;
    line-height: 1.6;
    text-align: center;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
  }
  .carte .face { font-size: .85rem; font-weight: 600; margin-bottom: 10px; color: var(--accent); }
  .carte.reponse .face { color: var(--answer); }

  .nav { display: flex; gap: 10px; margin-top: 14px; }
  .nav .btn { flex: 1; }
  .aide { margin: 12px 0 0; font-size: .85rem; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<main class="app">
  <h1>
    <svg viewBox="0 0 64 64" aria-hidden="true" focusable="false">
      <rect width="64" height="64" rx="14" fill="#1f6feb"/>
      <rect x="14" y="12" width="36" height="40" rx="5" fill="#ffffff" fill-opacity="0.5" transform="rotate(-9 32 32)"/>
      <g transform="rotate(5 32 32)">
        <rect x="14" y="12" width="36" height="40" rx="5" fill="#ffffff"/>
        <path d="M24 27 C24 22.5 27.5 19 32 19 C36.5 19 40 22.5 40 26.5 C40 31.5 32 31.5 32 36.5"
              fill="none" stroke="#1f6feb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="32" cy="43.5" r="3.2" fill="#1f6feb"/>
      </g>
    </svg>
    <span>FlashCards pour Réviser</span>
  </h1>

  <!-- Menu -->
  <section id="menu" class="panel">
    <label class="field" for="fichier">Jeu de cartes</label>
    <select id="fichier" disabled><option>Chargement…</option></select>

    <label class="check"><input type="checkbox" id="melange"> Ordre aléatoire</label>

    <button id="start" class="btn primary" disabled>Commencer</button>
    <button id="btn-local" class="btn link" type="button">Ouvrir un CSV de mon ordinateur</button>
    <input type="file" id="local" accept=".csv,text/csv,text/plain" hidden>

    <p id="status" role="status"></p>

    <!-- Affiché seulement quand la page est ouverte en local (file://) -->
    <div id="local-info" class="local-info" hidden>
      <div>Dossier de cette page (à coller dans la fenêtre « Ouvrir ») :</div>
      <code id="chemin"></code>
      <button id="copier" class="btn link" type="button">Copier le chemin</button>
    </div>
  </section>

  <!-- Jeu -->
  <section id="jeu" hidden>
    <div class="top">
      <span class="titre" id="titre"></span>
      <span id="compteur"></span>
    </div>

    <button id="carte" class="carte" type="button" aria-live="polite"></button>

    <div class="nav">
      <button id="prev" class="btn" type="button">◀ Précédent</button>
      <button id="next" class="btn" type="button">Suivant ▶</button>
    </div>
    <p class="aide">Clic ou Espace : retourner la carte · Flèches ← → : naviguer</p>
    <p style="text-align:center"><button id="retour" class="btn link" type="button">Changer de jeu de cartes</button></p>
  </section>
</main>

<script>
(function () {
  // ================= CONFIGURATION =================
  const DOSSIER = 'FlashCards';   // sous-dossier contenant les .csv (à côté de index.html)

  // Ordre de recherche des fichiers :
  //   1) index.json (à la racine, à côté de index.html) : ["chimie.csv", "maths.csv"]
  //   2) API GitHub (uniquement sur github.io)
  //   3) la liste ci-dessous
  // Exemple : const FICHIERS = ['chimie.csv', 'maths.csv'];
  const FICHIERS = [];
  // =================================================

  const $ = id => document.getElementById(id);
  const menu = $('menu'), jeu = $('jeu'), selectEl = $('fichier'), statusEl = $('status');
  const carteEl = $('carte');
  const LOCAL = location.protocol === 'file:';   // page ouverte directement depuis le disque

  let cartes = [];
  let index = 0;
  let reponse = false;

  /* ---------- MathJax (LaTeX + chimie avec \ce{}) ---------- */
  window.MathJax = {
    tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], packages: { '[+]': ['mhchem'] } },
    loader: { load: ['[tex]/mhchem'] },
    startup: { typeset: false }
  };
  const mj = document.createElement('script');
  mj.src = 'https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js';
  mj.async = true;
  document.head.appendChild(mj);

  function formules(el, essais) {
    essais = essais || 0;
    if (window.MathJax && window.MathJax.typesetPromise) {
      try { window.MathJax.typesetClear([el]); } catch (e) {}
      window.MathJax.typesetPromise([el]).catch(console.error);
    } else if (essais < 100) {
      setTimeout(() => formules(el, essais + 1), 100);
    }
  }

  /* ---------- Messages ---------- */
  function message(texte, erreur) {
    statusEl.textContent = texte;
    statusEl.className = erreur ? 'error' : '';
  }

  /* ---------- Liste des fichiers du dossier ---------- */
  async function listerFichiers() {
    // 1) index.json à la racine : liste de noms de fichiers situés dans FlashCards/
    try {
      const r = await fetch('index.json');
      if (r.ok) {
        const noms = await r.json();
        if (Array.isArray(noms)) {
          const valides = noms.filter(n => typeof n === 'string' && /\.csv$/i.test(n));
          if (valides.length) return valides;
        }
      }
    } catch (e) { /* pas d'index.json valide : on essaie la suite */ }

    // 2) Sur GitHub Pages : lecture automatique du dossier via l'API GitHub
    if (location.hostname.endsWith('.github.io')) {
      try {
        const owner = location.hostname.split('.')[0];
        const seg = location.pathname.split('/')[1] || '';
        const repo = (seg && !seg.includes('.')) ? seg : location.hostname;
        const r = await fetch('https://api.github.com/repos/' + owner + '/' + repo + '/contents/' + DOSSIER);
        if (r.ok) {
          const noms = (await r.json())
            .filter(f => f.type === 'file' && /\.csv$/i.test(f.name))
            .map(f => f.name);
          if (noms.length) return noms;
        }
      } catch (e) { console.warn('API GitHub indisponible', e); }
    }

    // 3) liste manuelle
    return FICHIERS;
  }

  /* ---------- Lecture du CSV (guillemets, virgules, retours à la ligne) ---------- */
  function lireCSV(texte) {
    if (texte.charCodeAt(0) === 0xFEFF) texte = texte.slice(1); // BOM
    const premiere = texte.split(/\r?\n/, 1)[0] || '';
    const sep = premiere.split(';').length > premiere.split(',').length ? ';' : ',';

    const lignes = [];
    let ligne = [], cell = '', guillemets = false;
    for (let i = 0; i < texte.length; i++) {
      const c = texte[i];
      if (guillemets) {
        if (c === '"') {
          if (texte[i + 1] === '"') { cell += '"'; i++; } else { guillemets = false; }
        } else { cell += c; }
      } else if (c === '"') { guillemets = true; }
      else if (c === sep) { ligne.push(cell); cell = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && texte[i + 1] === '\n') i++;
        ligne.push(cell); cell = ''; lignes.push(ligne); ligne = [];
      } else { cell += c; }
    }
    ligne.push(cell); lignes.push(ligne);

    return lignes
      .filter(l => l.length >= 2)
      .map(l => ({ q: l[0].trim(), r: l[1].trim() }))
      .filter(c => c.q && c.r);
  }

  /* ---------- Chargement d'un jeu de cartes ---------- */
  async function chargerDepuisDossier(nom) {
    const r = await fetch(DOSSIER + '/' + encodeURIComponent(nom));
    if (!r.ok) throw new Error('Fichier introuvable (' + r.status + ') : ' + DOSSIER + '/' + nom);
    const texte = await r.text();
    if (/^\s*<(!doctype|html)/i.test(texte)) throw new Error('Le fichier ' + nom + ' n\'est pas un CSV valide.');
    return lireCSV(texte);
  }

  async function demarrer(titre, obtenirCartes) {
    try {
      message('Chargement…');
      const liste = await obtenirCartes();
      if (!liste.length) throw new Error('Aucune carte valide : il faut deux colonnes (question, réponse).');
      cartes = liste.slice();
      if ($('melange').checked) {
        for (let i = cartes.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [cartes[i], cartes[j]] = [cartes[j], cartes[i]];
        }
      }
      index = 0; reponse = false;
      $('titre').textContent = titre;
      menu.hidden = true; jeu.hidden = false;
      message('');
      afficher();
      carteEl.focus();
    } catch (e) {
      console.error(e);
      message(e.message, true);
    }
  }

  /* ---------- Affichage de la carte ---------- */
  function afficher() {
    const c = cartes[index];
    $('compteur').textContent = 'Carte ' + (index + 1) + ' / ' + cartes.length;
    carteEl.classList.toggle('reponse', reponse);
    carteEl.innerHTML =
      '<span class="face">' + (reponse ? 'Réponse' : 'Question') + '</span>' +
      '<div>' + (reponse ? c.r : c.q).replace(/\n/g, '<br>') + '</div>';
    formules(carteEl);
  }

  function retourner() { reponse = !reponse; afficher(); }
  function aller(delta) {
    reponse = false;
    index = (index + delta + cartes.length) % cartes.length;
    afficher();
  }

  /* ---------- Ouvrir un CSV de l'ordinateur ---------- */
  // Un navigateur ne permet pas à une page d'imposer le dossier de départ de la fenêtre « Ouvrir ».
  // Chrome/Edge : l'option "id" fait rouvrir la fenêtre dans le dernier dossier utilisé pour ce rôle.
  // Autres navigateurs (ou page dans un iframe) : sélecteur de fichier classique.
  async function choisirFichierLocal() {
    const api = window.showOpenFilePicker && window.self === window.top;
    if (!api) { $('local').click(); return; }
    try {
      const [h] = await window.showOpenFilePicker({
        id: 'flashcards-csv',
        startIn: 'documents',
        multiple: false,
        types: [{ description: 'Fichiers CSV', accept: { 'text/csv': ['.csv'], 'text/plain': ['.csv'] } }]
      });
      const f = await h.getFile();
      demarrer(f.name.replace(/\.csv$/i, ''), async () => lireCSV(await f.text()));
    } catch (e) {
      if (e.name !== 'AbortError') { console.error(e); $('local').click(); }
    }
  }

  // Chemin du dossier de la page (mode file://), en notation du système (Windows ou Unix)
  function dossierDeLaPage() {
    let p = location.pathname;
    try { p = decodeURIComponent(p); } catch (e) {}
    p = p.replace(/[^/]*$/, '');                      // retire "index.html"
    if (/^\/[A-Za-z]:\//.test(p)) p = p.slice(1).replace(/\//g, '\\');   // C:\Users\...
    return p;
  }

  /* ---------- Événements ---------- */
  carteEl.addEventListener('click', retourner);
  $('prev').addEventListener('click', () => aller(-1));
  $('next').addEventListener('click', () => aller(1));
  $('retour').addEventListener('click', () => { jeu.hidden = true; menu.hidden = false; });

  document.addEventListener('keydown', e => {
    if (jeu.hidden) return;
    if (e.key === 'ArrowRight') aller(1);
    else if (e.key === 'ArrowLeft') aller(-1);
    else if (e.key === ' ' && !e.target.closest('button, select, input')) { e.preventDefault(); retourner(); }
  });

  $('start').addEventListener('click', () => {
    const nom = selectEl.value;
    demarrer(nom.replace(/\.csv$/i, ''), () => chargerDepuisDossier(nom));
  });

  $('btn-local').addEventListener('click', choisirFichierLocal);
  $('local').addEventListener('change', e => {
    const fichier = e.target.files[0];
    if (!fichier) return;
    demarrer(fichier.name.replace(/\.csv$/i, ''), async () => lireCSV(await fichier.text()));
    e.target.value = '';
  });

  $('copier').addEventListener('click', async () => {
    const chemin = $('chemin').textContent;
    try {
      await navigator.clipboard.writeText(chemin);
      $('copier').textContent = 'Copié ✔';
    } catch (e) {
      // Copie impossible : on sélectionne le texte pour un Ctrl+C manuel
      const sel = window.getSelection(), range = document.createRange();
      range.selectNodeContents($('chemin'));
      sel.removeAllRanges(); sel.addRange(range);
      $('copier').textContent = 'Sélectionné : faites Ctrl+C';
    }
  });

  /* ---------- Initialisation ---------- */
  if (LOCAL) {
    // Page ouverte depuis le disque : le navigateur bloque la lecture des fichiers voisins,
    // on passe donc directement par le sélecteur de fichier.
    selectEl.innerHTML = '<option>Mode local : choisissez un CSV ci-dessous</option>';
    $('btn-local').className = 'btn primary';
    $('btn-local').style.marginLeft = '8px';
    $('chemin').textContent = dossierDeLaPage();
    $('local-info').hidden = false;
    message('Page ouverte en local : le navigateur ne peut pas lister le dossier ' + DOSSIER + ' tout seul. Ouvrez un CSV avec le bouton.');
  } else {
    listerFichiers().then(noms => {
      selectEl.innerHTML = '';
      if (!noms.length) {
        selectEl.innerHTML = '<option>Aucun fichier</option>';
        message('Aucun fichier trouvé. Ajoutez des .csv dans « ' + DOSSIER + '/ » et listez-les dans index.json (à la racine). Vous pouvez aussi ouvrir un CSV de votre ordinateur.', true);
        return;
      }
      noms.sort((a, b) => a.localeCompare(b, 'fr', { numeric: true })).forEach(nom => {
        const o = document.createElement('option');
        o.value = nom;
        o.textContent = nom.replace(/\.csv$/i, '');
        selectEl.appendChild(o);
      });
      selectEl.disabled = false;
      $('start').disabled = false;
    });
  }
})();
</script>
</body>
</html>
